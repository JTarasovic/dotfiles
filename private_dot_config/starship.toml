# ── Claude Code statusline ──────────────────────────────────────────────────

[profiles]
claude-code = "$git_branch$git_status$claude_model${custom.claude_effort}$claude_cost$claude_context${custom.claude_limits}"

[claude_model]
symbol = " "
style  = "bold bright-blue"
format = "[$symbol$model]($style) "
model_aliases = { "claude-sonnet-4-6" = "Sonnet 4.6", "claude-opus-4-8" = "Opus 4.8", "claude-haiku-4-5-20251001" = "Haiku 4.5" }

[claude_context]
# session token totals, then gauge + % colored by pressure
format = "[↓$input_tokens ↑$output_tokens](bright-black) [$gauge $percentage]($style) "
display = [
  { threshold = 0,  style = "green" },
  { threshold = 60, style = "yellow" },
  { threshold = 80, style = "bold red" },
]

# No built-in module for effort: read the saved level out of settings.json.
# Only referenced from the claude-code profile; the shell prompt's `format` drops
# the catch-all `$custom` so custom modules don't leak into the regular prompt.
[custom.claude_effort]
command = 'jq -r ".effortLevel // empty" ~/.claude/settings.json'
when    = true
shell   = ["sh", "-c"]
use_stdin = false   # starship otherwise pipes its stdin in and the output comes back empty
symbol  = "󰧑 "
style   = "purple"
format  = "[$symbol$output]($style) "

# Plan usage (5-hour and weekly windows). Claude Code puts these in the
# statusline payload under `rate_limits`, but starship has no module for them
# (upstream request: starship/starship#7441), so ~/.local/bin/claude-statusline
# stashes the payload and jq digs them out.
#
# Rendered to match [claude_context]: the same 5-cell gauge (full block, a
# partial once the remainder passes a quarter cell, light shade for empty) and
# the same green/yellow/red thresholds. Colors are inlined as raw truecolor
# escapes because a custom module has one `style` and no `display` table --
# the values mirror [palettes.nord] above.
#
# `resets_at` is Unix epoch seconds, so the trailing countdown is derived --
# omitted once the window has already rolled over.
[custom.claude_limits]
command = """
jq -r '
  def dim: "\\u001b[38;2;76;86;106m\\(.)\\u001b[0m";
  def color: if   . >= 80 then "\\u001b[1;38;2;191;97;106m"
             elif . >= 60 then "\\u001b[38;2;235;203;139m"
             else            "\\u001b[38;2;163;190;140m" end;
  def gauge:
    (. / 100 * 5) as $f
    | ($f | floor) as $full
    | (if $f - $full >= 0.25 then 1 else 0 end) as $part
    | ("\\u2588" * $full // "") + ("\\u2592" * $part // "")
      + ("\\u2591" * (5 - $full - $part) // "");
  def eta:
    ((. - now) / 60 | floor) as $mins
    | ($mins / 60 | floor) as $hours
    | if   $mins <= 0  then ""
      else " " + (if   $hours >= 24 then "\\($hours / 24 | floor)d\\($hours % 24)h"
                  elif $hours > 0   then "\\($hours)h\\($mins % 60)m"
                  else                   "\\($mins)m" end | dim) end;
  def window($label): select(. != null)
    | .used_percentage as $pct
    | ($label | dim) + " \\($pct | color)\\($pct | gauge) \\($pct | round)%\\u001b[0m"
      + (.resets_at // 0 | eta);
  .rate_limits // {}
  | [ (.five_hour | window("5h")), (.seven_day | window("7d")) ]
  | join(" ")
' "${XDG_RUNTIME_DIR:-/tmp}/claude-statusline.json" 2>/dev/null
"""
when      = true
shell     = ["sh", "-c"]
use_stdin = false
format    = "$output"

[claude_cost]
symbol = " "
format = '[$symbol\$$cost]($style) '
display = [
  { threshold = 0,   style = "green" },
  { threshold = 1,   style = "yellow" },
  { threshold = 5,   style = "bold red" },
]
